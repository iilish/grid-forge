name: gridforge

x-gridforge-image: &gridforge-image
  build:
    context: .
    args:
      BUILD_SHA: ${GRIDFORGE_BUILD_SHA:-dev}
  image: gridforge:local

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-gridforge}:${POSTGRES_PASSWORD:-gridforge}@postgres:5432/${POSTGRES_DB:-gridforge}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridforge}
      POSTGRES_DB: ${POSTGRES_DB:-gridforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridforge} -d ${POSTGRES_DB:-gridforge}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *gridforge-image
    command: ["migrate"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gridforge:
    <<: *gridforge-image
    command: ["serve"]
    environment:
      <<: *database-url
      GRIDFORGE_HTTP_ADDR: 0.0.0.0:8080
      GRIDFORGE_ORG_ID: ${GRIDFORGE_ORG_ID:-00000000-0000-0000-0000-000000000001}
      RUST_LOG: ${RUST_LOG:-info,gridforge=debug}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
