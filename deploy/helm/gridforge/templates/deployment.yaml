apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gridforge.fullname" . }}
  labels:
    {{- include "gridforge.labels" . | nindent 4 }}
  annotations:
    gridforge.io/build-sha: {{ .Values.buildSha | quote }}
    gridforge.io/image-digest: {{ .Values.image.digest | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gridforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gridforge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        gridforge.io/build-sha: {{ .Values.buildSha | quote }}
        gridforge.io/image-digest: {{ .Values.image.digest | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gridforge
          image: {{ include "gridforge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "gridforge.databaseEnv" . | nindent 12 }}
            - name: GRIDFORGE_HTTP_ADDR
              value: {{ .Values.httpAddr | quote }}
            - name: GRIDFORGE_ORG_ID
              value: {{ .Values.orgId | quote }}
            - name: RUST_LOG
              value: {{ .Values.logFilter | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
