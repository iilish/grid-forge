apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gridforge-postgres-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: gridforge
    app.kubernetes.io/component: database
spec:
  project: default
  source:
    repoURL: https://github.com/iilish/grid-forge.git
    targetRevision: main
    path: deploy/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
