apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gridforge-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: gridforge
    app.kubernetes.io/component: root
spec:
  project: default
  source:
    repoURL: https://github.com/iilish/grid-forge.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
